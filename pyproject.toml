[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "sysmaint"
version = "3.0.0"
description = "Cross-Platform System Maintenance, Security & Data Recovery Microservice by Kennny7 Microservices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kennny7", email = "kennny7@users.noreply.github.com" }]
keywords = [
    "sysmaint",
    "system-maintenance",
    "microservice",
    "data-recovery",
    "malware-scanner",
    "diagnostics",
    "tui",
    "kennny7-microservices",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]
yara = [
    "yara-python>=4.2.0",
]
all = [
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
    "yara-python>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/Kennny7/sysmaint"
Repository = "https://github.com/Kennny7/sysmaint"
Documentation = "https://github.com/Kennny7/sysmaint/blob/main/USER_GUIDE.md"
Issues = "https://github.com/Kennny7/sysmaint/issues"

[project.scripts]
sysmaint = "sysmaint.cli:main"
sysmaint-tui = "sysmaint.tui.app:launch_tui"
sysmaint-serve = "sysmaint.service.server:run_server"
sysmaint-gui = "sysmaint.gui.app:launch_gui"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sysmaint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
